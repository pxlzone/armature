kind: store
role: derived files, never committed
description: armature/.cache in a project. Everything in it can be deleted and is built again.
holds:
  - id: code-index
    shape: CodeIndex
  - id: reports
    note: JUnit and lcov files the project's tests write.
  - id: failures
    note: Requirements that failed in the last test report read, so removing a report does not clear a failure.
  - id: history
    note: Recent commits and the files each changed.
  - id: summaries
    note: One-line file summaries written by a model.
  - id: live
    note: One line per step of an agent session (a file read or edited, the name of a command, a stop), for the viewer. Trimmed as it grows.
  - id: hook-state
    note: What a hook has already said in a session, and an approval waiting to be recorded.
