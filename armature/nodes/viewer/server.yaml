kind: service
role: serves graph and documents
tech: [node]
code: [src/server.ts]
tests: [test/review.test.ts]

accepts:
  - id: graph
    via: http
    route: GET /graph.json
    gives: Graph
    auth: local
    note: Bound to 127.0.0.1, so only this machine can reach it. The graph carries each node's files, with their size and the files they import, for the map to draw inside the node.
  - id: doc
    via: http
    route: GET /doc
    gives: MarkdownText
    auth: local
    note: One Markdown file of the repo, by path. Nothing outside the repo and nothing that is not Markdown.
  - id: live
    via: http
    route: GET /live.json
    gives: Live
    auth: local
    note: What agent sessions are doing right now. The page asks again each time the events stream says "live".
  - id: watchers
    via: http
    route: GET /watchers
    auth: local
    note: How many pages show the session view right now. A hook asks before a session's first edit.
  - id: diff
    via: http
    route: GET /diff
    gives: DiffText
    auth: local
    note: What one file holds that the last commit does not, by path. Only for a file an agent session shown on the page edited.
  - id: approve
    via: http
    route: POST /approve
    takes: ApproveRequest
    gives: Answer
    auth: local
    note: Approves one change for the person looking at the page. Needs the token the server put in that page, and its own host and origin. The one thing the viewer writes.
  - id: serve
    via: in-process
    takes: Command
    note: '"armature view" starts it; "armature export" writes the same page with the graph inside.'

reads: [project.model#documents]
calls:
  - to: core.compiler#compile
  - to: core.answers#live
  - to: core.code-graph#index
  - to: core.model-tools#edit
    note: approveChange, for the approve request only.

todos:
  - text: No test covers the server's read routes or the static export.
    kind: debt

requirements:
  - id: approve-only-from-page
    text: A change is approved only by a request that carries the page's token from the server's own host and origin.
    tests: test/review.test.ts
    match: refuses a request that does not come from the page the server gave out
