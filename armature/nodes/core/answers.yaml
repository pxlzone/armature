kind: library
shared: false
role: text answers for agents
tech: [typescript]
code:
  - src/render.ts
  - src/codeview.ts
  - src/context.ts
  - src/diff.ts
  - src/summarize.ts
  - src/eval.ts
  - src/live.ts
tests: [test/deep.test.ts, test/tools.test.ts, test/sound.test.ts, test/live.test.ts]

accepts:
  - id: text
    via: in-process
    takes: Graph
    gives: Answer
    note: orient, show, impact, path, trace, drift, context and the rest. Each takes a compiled graph and returns plain text.

  - id: live
    via: in-process
    takes: Graph
    gives: Live
    note: noteLive writes one step of an agent session to the log; readLive turns the log into sessions, the parts they touched and the files they edited, with each file's size against the last commit; fileDiff gives what changed in one of those files.

reads: [project.cache#summaries, project.cache#live]
writes: [project.cache#summaries, project.cache#live]
calls:
  - to: core.compiler#compile
    note: diff compiles the model at a git ref beside the one in the working tree.
  - to: outside.git#commands
  - to: outside.claude-cli#prompt
    note: File summaries and the live-agent evaluation. Both cost money and run only with --yes.

rules:
  - An answer is read by an agent with a budget. Say the most useful thing first, and cap every list.
  - When an answer rests on something that was not checked, say so in the answer.

requirements:
  - id: diff-only-of-edited-files
    kind: security
    text: The diff of a file is given only for a file an agent session shown in the viewer edited, never for a path the page merely asks for.
    tests: test/live.test.ts
    match: shows the diff of a file a session edited, and of no other file
  - id: live-names-no-command
    kind: security
    text: The log of agent sessions holds the name of a command and never the command, which can carry a secret.
    tests: test/live.test.ts
    match: one line per step, with the name of a command and never the command
  - id: diff-lists-model-changes
    text: The diff against a git ref lists what was added, changed and removed, in the model's own terms.
    tests: test/tools.test.ts
    match: lists what a branch adds, changes and removes
  - id: follows-data
    text: Path, trace and impact follow data across several links, through shapes that embed a shape, and to where it leaves the system.
    tests: test/sound.test.ts
    match: follows data across several links
