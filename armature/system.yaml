name: Armature
headline: One model of a system in text files, read as a diagram by people and as context by coding agents.

# People and agents who use the tool.
actors:
  - id: developer
    role: reads the diagram, approves changes
    calls:
      - to: cli#commands
        via: cli
      - to: viewer.app#diagram
        via: http
  - id: coding-agent
    role: edits the model and code
    calls:
      - to: agent.mcp#tools
        via: mcp
      - to: cli#commands
        via: cli

# What the tool runs on and talks to.
externals:
  - id: claude-code
    parent: outside
    role: runs hooks around tool calls
    calls:
      - to: agent.hooks#events
        via: cli
  - id: git
    parent: outside
    role: file list, history, old versions
    accepts:
      - id: commands
        via: cli
        takes: Command
        gives: Answer
  - id: github
    parent: outside
    role: pull requests, through gh
    accepts:
      - id: pull-requests
        via: cli
        gives: PullRequest
  - id: claude-cli
    parent: outside
    role: model calls for summaries
    accepts:
      - id: prompt
        via: cli
        takes: Prompt
        gives: Answer

rules:
  - Run "npm test" and "npm run typecheck" before you call a change done.
  - A change to the language is a change to SPEC.md, the schema, the language skill and the compiler together. test/consistency.test.ts checks that they agree.
  - plugin/ is generated by "npm run build:plugin". Never edit it by hand.
  - What the tool prints is read by people and by agents. Write it as plain sentences that say what to do next.

ignore:
  - path: plugin/**
    why: Generated by scripts/build-plugin.mjs and committed with each release.
